name: Publish Variant Images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-variants.yaml"
      - ".github/workflows/build-variant.yaml"
      - "variants/**"
      - "maps.json"
      - "maps.casual.json"
      - "maps/**"
      - "tf2version.txt"
  pull_request:
    branches:
      - main

jobs:
  build-fat-tf2-standard-competitive-i386:
    uses: ./.github/workflows/build-variant.yaml
    with:
      variant-name: fat-tf2-standard-competitive-i386
      dockerfile-path: ./variants/fat-standard-competitive-i386/Dockerfile
      image-name: sonikro/fat-tf2-standard-competitive-i386
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build-fat-tf2-casual-i386:
    uses: ./.github/workflows/build-variant.yaml
    with:
      variant-name: fat-tf2-casual-i386
      dockerfile-path: ./variants/fat-casual-i386/Dockerfile
      image-name: sonikro/fat-tf2-casual-i386
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build-fat-tf2-pickup:
    needs: build-fat-tf2-standard-competitive-i386
    uses: ./.github/workflows/build-variant.yaml
    with:
      variant-name: fat-tf2-pickup
      dockerfile-path: ./variants/fat-tf2pickup/Dockerfile
      image-name: sonikro/fat-tf2-pickup
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build-fat-tf2center:
    needs: build-fat-tf2-standard-competitive-i386
    uses: ./.github/workflows/build-variant.yaml
    with:
      variant-name: fat-tf2center
      dockerfile-path: ./variants/fat-tf2center/Dockerfile
      image-name: sonikro/fat-tf2center
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build-fat-mge-tf:
    uses: ./.github/workflows/build-variant.yaml
    with:
      variant-name: fat-mge-tf
      dockerfile-path: ./variants/fat-mge-tf/Dockerfile
      image-name: sonikro/fat-mge-tf
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-release-notes:
    runs-on: ubuntu-latest
    needs:
      - build-fat-tf2-standard-competitive-i386
      - build-fat-tf2-casual-i386
      - build-fat-mge-tf
      - build-fat-tf2-pickup
      - build-fat-tf2center
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest commit
        id: commit
        run: |
          LAST_COMMIT=$(git log --oneline -1 --no-decorate)
          echo "message=$LAST_COMMIT" >> $GITHUB_OUTPUT

      - name: Publish to Discord
        uses: Ilshidur/action-discord@master
        with:
          args: |
            🚀 **TF2-QuickServer Release**
            
            New TF2 Server images have been published
            
            **Latest Commit:**
            `${{ steps.commit.outputs.message }}`
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}

  publish-failure-notes:
    runs-on: ubuntu-latest
    needs:
      - build-fat-tf2-standard-competitive-i386
      - build-fat-tf2-casual-i386
      - build-fat-mge-tf
      - build-fat-tf2-pickup
      - build-fat-tf2center
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
    steps:
      - name: Find the failed job
        id: failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          row=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure")] | first | "\(.name)\t\(.html_url)"' \
            2>/dev/null || true)
          job_name="${row%%$'\t'*}"
          job_url="${row#*$'\t'}"
          if [ -z "${row}" ] || [ "${job_name}" = "${job_url}" ]; then
            job_name="build jobs"
            job_url="${run_url}"
          fi
          echo "name=${job_name}" >> "$GITHUB_OUTPUT"
          echo "url=${job_url}" >> "$GITHUB_OUTPUT"

      - name: Publish failure to Discord
        uses: Ilshidur/action-discord@master
        with:
          args: |
            ⚠️ **TF2-QuickServer — image publish failed**

            A variant build failed, so no images were published in this run.

            **Failed job:** `${{ steps.failed.outputs.name }}`
            **Details:** ${{ steps.failed.outputs.url }}
            **Commit:** `${{ github.sha }}`
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}

