name: Probe i386 Container Networking

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/probe-i386-network.yaml"
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Runner and Docker facts
        run: |
          echo "label: ${{ matrix.runner }}"
          . /etc/os-release && echo "os: ${PRETTY_NAME}"
          echo "kernel: $(uname -r)"
          docker version
          echo "security options: $(docker info --format '{{json .SecurityOptions}}')"

      - name: i386 name resolution with the default seccomp profile
        continue-on-error: true
        run: |
          docker run --rm i386/debian:bookworm getent hosts client-download.steampowered.com

      - name: i386 name resolution with seccomp unconfined
        continue-on-error: true
        run: |
          docker run --rm --security-opt seccomp=unconfined i386/debian:bookworm \
            getent hosts client-download.steampowered.com

      - name: i386 TCP connect with the default seccomp profile
        continue-on-error: true
        run: |
          docker run --rm i386/debian:bookworm bash -c \
            'apt-get -qq update >/dev/null 2>&1; apt-get -qq install -y curl >/dev/null 2>&1;
             curl -sS -o /dev/null -w "http %{http_code} in %{time_total}s\n" \
               https://client-download.steampowered.com/client/steamcmd_linux.tar.gz'

      - name: SteamCMD bootstrap with the default seccomp profile
        continue-on-error: true
        run: |
          docker run --rm steamcmd/steamcmd:ubuntu-22 +login anonymous +quit 2>&1 | tail -20

      - name: SteamCMD bootstrap with seccomp unconfined
        continue-on-error: true
        run: |
          docker run --rm --security-opt seccomp=unconfined steamcmd/steamcmd:ubuntu-22 \
            +login anonymous +quit 2>&1 | tail -20
